<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Courier New', 'Courier', monospace">
  <style>
    .room { fill: none; stroke: #333; stroke-width: 1; }
    .room-active { fill: none; stroke: #da4444; stroke-width: 1.5; }
    .room-label { font-size: 9px; fill: #666; letter-spacing: 2px; text-transform: uppercase; }
    .agent-name { font-size: 11px; fill: #fff; font-weight: bold; letter-spacing: 1px; }
    .agent-role { font-size: 8px; fill: #888; letter-spacing: 0.5px; }
    .flow-arrow { stroke: #da4444; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .flow-arrow-dim { stroke: #444; stroke-width: 1; fill: none; marker-end: url(#arrowhead-dim); }
    .flow-label { font-size: 7px; fill: #da4444; letter-spacing: 1px; }
    .vault-fill { fill: #1a1a1a; }
    .bg { fill: #0d0d0d; }
    .stat { font-size: 18px; fill: #da4444; font-weight: bold; }
    .stat-label { font-size: 7px; fill: #666; letter-spacing: 2px; }
    .title { font-size: 12px; fill: #da4444; font-weight: bold; letter-spacing: 6px; }
    .human-box { fill: none; stroke: #555; stroke-width: 1; stroke-dasharray: 4,3; }
    .human-label { font-size: 8px; fill: #555; letter-spacing: 2px; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#da4444" />
    </marker>
    <marker id="arrowhead-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#444" />
    </marker>
  </defs>
  
  <rect width="900" height="650" class="bg" />
  
  <!-- Piotr (human) — top, dashed border -->
  <rect x="370" y="12" width="160" height="28" class="human-box" rx="2" />
  <text x="450" y="30" text-anchor="middle" class="human-label">PIOTR · HUMAN · VETO</text>
  
  <!-- Arrow: Piotr → Wiktoria -->
  <path d="M 450 40 L 450 72" class="flow-arrow-dim" />
  
  <!-- ═══ AGENTS (ring around vault) ═══ -->
  
  <!-- Wiktoria — top center -->
  <rect x="355" y="74" width="190" height="66" class="room-active" rx="2" />
  <text x="372" y="96" class="agent-name" style="font-size:12px;">WIKTORIA</text>
  <text x="372" y="110" class="agent-role">PRESIDENT · OPERATOR</text>
  <text x="372" y="124" class="agent-role">brief → decrees → publish</text>
  <text x="555" y="96" class="agent-role" style="fill:#da4444; font-size:7px;">→ X · IG · WEB</text>
  
  <!-- Archiwistka — left -->
  <rect x="30" y="140" width="190" height="66" class="room" rx="2" />
  <text x="47" y="162" class="agent-name">ARCHIWISTKA</text>
  <text x="47" y="176" class="agent-role">INVESTIGATOR</text>
  <text x="47" y="190" class="agent-role">archive → findings</text>
  
  <!-- Mikołaj — right -->
  <rect x="680" y="140" width="190" height="66" class="room" rx="2" />
  <text x="697" y="162" class="agent-name">MIKOŁAJ</text>
  <text x="697" y="176" class="agent-role">VERIFIER</text>
  <text x="697" y="190" class="agent-role">findings → claims</text>
  
  <!-- ═══ VAULT (center) ═══ -->
  <rect x="300" y="230" width="300" height="250" class="room-active" rx="2" />
  <rect x="300" y="230" width="300" height="250" class="vault-fill" rx="2" opacity="0.5" />
  <text x="450" y="252" text-anchor="middle" class="room-label" style="fill:#da4444; font-size:10px;">VAULT — KANCELARIA URZĘDU</text>
  
  <!-- Vault rooms inside -->
  <rect x="312" y="262" width="130" height="38" class="room" rx="1" />
  <text x="377" y="278" text-anchor="middle" class="stat">81</text>
  <text x="377" y="293" text-anchor="middle" class="stat-label">FINDINGS</text>
  
  <rect x="458" y="262" width="130" height="38" class="room" rx="1" />
  <text x="523" y="278" text-anchor="middle" class="stat">13</text>
  <text x="523" y="293" text-anchor="middle" class="stat-label">CLAIMS</text>
  
  <rect x="312" y="310" width="130" height="38" class="room" rx="1" />
  <text x="377" y="326" text-anchor="middle" class="stat">12</text>
  <text x="377" y="341" text-anchor="middle" class="stat-label">DOSSIERS</text>
  
  <rect x="458" y="310" width="130" height="38" class="room" rx="1" />
  <text x="523" y="326" text-anchor="middle" class="stat">23</text>
  <text x="523" y="341" text-anchor="middle" class="stat-label">SOURCES</text>
  
  <!-- Obieg -->
  <rect x="312" y="358" width="276" height="25" class="room" rx="1" />
  <text x="450" y="374" text-anchor="middle" class="room-label">OBIEG → ROUTING TO AGENTS</text>
  
  <!-- Decrees + Runs -->
  <rect x="312" y="393" width="130" height="25" class="room" rx="1" />
  <text x="377" y="409" text-anchor="middle" class="room-label">DEKRETY</text>
  
  <rect x="458" y="393" width="130" height="25" class="room" rx="1" />
  <text x="523" y="409" text-anchor="middle" class="room-label">RUNS</text>
  
  <!-- External -->
  <rect x="312" y="428" width="276" height="25" class="room" rx="1" />
  <text x="450" y="444" text-anchor="middle" class="room-label">EXTERNAL INTELLIGENCE</text>
  
  <!-- ═══ BOTTOM AGENTS ═══ -->
  
  <!-- Ewa — bottom left -->
  <rect x="30" y="530" width="190" height="66" class="room" rx="2" />
  <text x="47" y="552" class="agent-name">EWA VIRUS</text>
  <text x="47" y="566" class="agent-role">NARRATOR</text>
  <text x="47" y="580" class="agent-role">claims → podcasts → extract</text>
  
  <!-- Peter — bottom center -->
  <rect x="355" y="530" width="190" height="66" class="room" rx="2" />
  <text x="372" y="552" class="agent-name">PETER</text>
  <text x="372" y="566" class="agent-role">SYNTHESIZER</text>
  <text x="372" y="580" class="agent-role">connections → dossiers</text>
  
  <!-- Researcher — bottom right -->
  <rect x="680" y="530" width="190" height="66" class="room" rx="2" />
  <text x="697" y="552" class="agent-name">RESEARCHER</text>
  <text x="697" y="566" class="agent-role">EVIDENCE COLLECTOR</text>
  <text x="697" y="580" class="agent-role">world → external intel</text>
  
  <!-- ═══ FLOW ARROWS ═══ -->
  
  <!-- Wiktoria ↔ vault -->
  <path d="M 430 140 L 430 228" class="flow-arrow" />
  <text x="410" y="190" class="flow-label">DECREES</text>
  <path d="M 470 228 L 470 140" class="flow-arrow-dim" />
  <text x="478" y="190" class="flow-label" style="fill:#444">BRIEF</text>
  
  <!-- Archiwistka → vault -->
  <path d="M 220 185 L 298 290" class="flow-arrow" />
  <text x="240" y="235" class="flow-label" transform="rotate(-33, 240, 235)">FINDINGS</text>
  
  <!-- Vault → Mikołaj -->
  <path d="M 602 290 L 678 185" class="flow-arrow" />
  <text x="655" y="235" class="flow-label" transform="rotate(33, 655, 235)">VERIFY</text>
  
  <!-- Mikołaj → vault -->
  <path d="M 678 195 L 602 310" class="flow-arrow-dim" />
  <text x="625" y="262" class="flow-label" style="fill:#444" transform="rotate(-33, 625, 262)">CLAIMS</text>
  
  <!-- Vault → Ewa -->
  <path d="M 298 440 L 220 540" class="flow-arrow" />
  <text x="235" y="495" class="flow-label" transform="rotate(33, 235, 495)">NARRATE</text>
  
  <!-- Ewa → vault -->
  <path d="M 220 555 L 298 455" class="flow-arrow-dim" />
  <text x="245" y="515" class="flow-label" style="fill:#444" transform="rotate(-33, 245, 515)">EXTRACT</text>
  
  <!-- Vault ↔ Peter -->
  <path d="M 430 480 L 430 528" class="flow-arrow" />
  <text x="438" y="508" class="flow-label">SYNTH</text>
  <path d="M 470 528 L 470 480" class="flow-arrow-dim" />
  <text x="478" y="508" class="flow-label" style="fill:#444">DOSS</text>
  
  <!-- Researcher → vault -->
  <path d="M 678 555 L 602 445" class="flow-arrow" />
  <text x="655" y="495" class="flow-label" transform="rotate(33, 655, 495)">INTEL</text>
  
  <!-- ═══ FOOTER ═══ -->
  <line x1="30" y1="620" x2="870" y2="620" stroke="#222" stroke-width="1" />
  <text x="450" y="638" text-anchor="middle" class="room-label" style="fill:#444; font-size:8px; letter-spacing:3px;">*/2h SIGNALS · */6h FEEDS · 2AM PODCAST · 3AM DREAM · 8AM BRIEF · SUN HEALTH</text>
  
</svg>
